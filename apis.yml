name: Stealth Worker
description: Stealth Worker is a cybersecurity staffing marketplace (Y Combinator W2016) that connects
  companies with vetted, contract-based information security, cloud security, privacy, and compliance
  professionals at competitive hourly rates. Engagements range from a few hours a week to full-time,
  covering InfoSec staffing, GDPR / data protection officer services, penetration testing, security
  architecture, SOC 2 / SOX / HIPAA / PCI audit and compliance, and CISO-as-a-service. Roughly 80% of
  consultants are US-based, with coverage across Europe, Asia, and Australia in 15+ countries. It is a
  professional-services company with no public developer API surface.
